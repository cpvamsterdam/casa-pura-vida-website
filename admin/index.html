<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Casa Pura Vida</title>
<style>
  :root{
    --white:#ffffff; --off-white:#FAFAF9; --ink:#1A1D1F; --ink-soft:#54595E;
    --canal:#2F6B73; --canal-deep:#1E4A50; --canal-tint:#EAF3F2; --brass:#B8935A;
    --line:#E7E5E1; --radius:14px; --danger:#B3261E;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; color:var(--ink); background:var(--off-white); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{background:#fff; border-radius:20px; border:1px solid var(--line); padding:32px; width:100%; max-width:420px; box-shadow:0 20px 50px -20px rgba(20,30,30,.15);}
  .wide-card{max-width:820px;}
  h1{font-size:20px; margin:0 0 6px;}
  p.sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 24px;}
  label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink-soft);}
  input[type=password], input[type=text], input[type=number], input[type=date]{
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line); font-size:15px; font-family:inherit; margin-bottom:16px;
  }
  input:focus{outline:2px solid var(--canal); outline-offset:1px;}
  button{cursor:pointer; font-family:inherit;}
  .btn-primary{width:100%; background:var(--canal); color:#fff; border:none; padding:12px; border-radius:100px; font-size:14.5px; font-weight:700;}
  .btn-primary:hover{background:var(--canal-deep);}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-secondary{background:#fff; color:var(--ink); border:1px solid var(--line); padding:9px 16px; border-radius:100px; font-size:13.5px; font-weight:600;}
  .error{color:var(--danger); font-size:13.5px; margin:-8px 0 14px; display:none;}
  .error.show{display:block;}
  .otp-input{letter-spacing:10px; font-size:22px; text-align:center; font-weight:700;}
  [data-view]{display:none;}
  [data-view].active{display:block;}

  /* Dashboard */
  .dash-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;}
  .section-title{font-size:15px; font-weight:700; margin:28px 0 12px; color:var(--canal-deep);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:8px;}
  .cal-nav{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .cal-nav button{background:var(--canal-tint); border:none; width:32px; height:32px; border-radius:50%; font-size:16px; color:var(--canal-deep);}
  .cal-month-label{font-weight:700; font-size:14px;}
  .day-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:12.5px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; user-select:none;}
  .day-cell.blocked{background:var(--danger); color:#fff; border-color:var(--danger);}
  .day-cell.empty{border:none; cursor:default;}
  .day-cell:hover:not(.empty){outline:2px solid var(--canal);}
  .legend{display:flex; gap:16px; font-size:12.5px; color:var(--ink-soft); margin-bottom:20px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:12px; height:12px; border-radius:4px; display:inline-block;}
  .price-row{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; align-items:end; margin-bottom:10px;}
  .price-row label{margin-bottom:4px;}
  .price-row input{margin-bottom:0;}
  .season-item{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--off-white); border-radius:10px; margin-bottom:8px; font-size:13.5px;}
  .season-item button{background:none; border:none; color:var(--danger); font-weight:700; cursor:pointer;}
  .save-bar{position:sticky; bottom:0; background:#fff; padding:16px 0; border-top:1px solid var(--line); margin-top:24px; display:flex; gap:10px; justify-content:flex-end;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--canal-deep); color:#fff; padding:12px 22px; border-radius:100px; font-size:13.5px; display:none;}
  .toast.show{display:block;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
</style>
</head>
<body>

<div class="card" data-view="password" id="viewPassword">
  <h1>Casa Pura Vida — Admin</h1>
  <p class="sub">Enter your admin password to continue.</p>
  <div class="error" id="passwordError"></div>
  <label for="passwordInput">Password</label>
  <input type="password" id="passwordInput" autocomplete="current-password">
  <button class="btn-primary" id="passwordSubmit">Continue</button>
</div>

<div class="card" data-view="otp" id="viewOtp">
  <h1>Check your email</h1>
  <p class="sub">We sent a 6-digit code to the admin email. It expires in 5 minutes.</p>
  <div class="error" id="otpError"></div>
  <label for="otpInput">Verification code</label>
  <input type="text" id="otpInput" class="otp-input" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
  <button class="btn-primary" id="otpSubmit">Verify &amp; log in</button>
</div>

<div class="card wide-card" data-view="dashboard" id="viewDashboard">
  <div class="dash-header">
    <div>
      <h1 style="margin-bottom:2px;">Booking management</h1>
      <p class="sub" style="margin:0;">Casa Pura Vida Amsterdam</p>
    </div>
    <button class="btn-secondary" id="logoutBtn">Log out</button>
  </div>

  <div class="section-title">Block / unblock dates</div>
  <div class="legend">
    <span><span class="dot" style="background:var(--danger);"></span> Blocked</span>
    <span><span class="dot" style="background:#fff; border:1px solid var(--line);"></span> Available</span>
  </div>
  <div class="cal-nav">
    <button id="calPrev">‹</button>
    <div class="cal-month-label" id="calMonthLabel"></div>
    <button id="calNext">›</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>

  <div class="section-title">Base pricing</div>
  <div class="two-col">
    <div>
      <label for="basePriceInput">Base price / night (₪, up to 6 guests)</label>
      <input type="number" id="basePriceInput">
    </div>
    <div>
      <label for="extraGuestInput">Extra guest / night (₪)</label>
      <input type="number" id="extraGuestInput">
    </div>
  </div>

  <div class="section-title">Seasonal price overrides</div>
  <div id="seasonList"></div>
  <div class="price-row">
    <div><label>Start date</label><input type="date" id="seasonStart"></div>
    <div><label>End date</label><input type="date" id="seasonEnd"></div>
    <div><label>Price/night (₪)</label><input type="number" id="seasonPrice"></div>
    <button class="btn-secondary" id="addSeasonBtn" style="height:44px;">Add</button>
  </div>

  <div class="save-bar">
    <button class="btn-secondary" id="reloadBtn">Discard changes</button>
    <button class="btn-primary" style="width:auto; padding:12px 28px;" id="saveBtn">Save changes</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/.netlify/functions';
let otpSessionId = null;
let bookingData = null;
let calViewDate = new Date();

function showView(name) {
  document.querySelectorAll('[data-view]').forEach(el => el.classList.toggle('active', el.dataset.view === name));
}
function showError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.classList.add('show');
}
function clearError(elId) {
  document.getElementById(elId).classList.remove('show');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function checkExistingSession() {
  try {
    const res = await fetch(`${API}/check-session`);
    const data = await res.json();
    if (data.loggedIn) {
      await loadDashboard();
      showView('dashboard');
      return;
    }
  } catch (e) {
    // Network hiccup or function unavailable - fall through to showing the login form below.
  }
  showView('password');
}

document.getElementById('passwordSubmit').addEventListener('click', async () => {
  clearError('passwordError');
  const password = document.getElementById('passwordInput').value;
  if (!password) return showError('passwordError', 'Enter your password.');
  const btn = document.getElementById('passwordSubmit');
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/login-step1`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok) { showError('passwordError', data.error || 'Login failed.'); return; }
    otpSessionId = data.otpSessionId;
    showView('otp');
  } catch (e) {
    showError('passwordError', 'Network error. Please try again.');
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('otpSubmit').addEventListener('click', async () => {
  clearError('otpError');
  const code = document.getElementById('otpInput').value.trim();
  if (!/^\d{6}$/.test(code)) return showError('otpError', 'Enter the 6-digit code.');
  const btn = document.getElementById('otpSubmit');
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/login-step2`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ otpSessionId, code }),
    });
    const data = await res.json();
    if (!res.ok) { showError('otpError', data.error || 'Verification failed.'); return; }
    await loadDashboard();
    showView('dashboard');
  } catch (e) {
    showError('otpError', 'Network error. Please try again.');
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch(`${API}/logout`, { method: 'POST' });
  location.reload();
});

async function loadDashboard() {
  const res = await fetch(`${API}/calendar`);
  bookingData = await res.json();
  document.getElementById('basePriceInput').value = bookingData.basePriceILS;
  document.getElementById('extraGuestInput').value = bookingData.extraGuestPriceILS;
  renderSeasons();
  renderCalendar();
}

function renderSeasons() {
  const list = document.getElementById('seasonList');
  list.innerHTML = '';
  bookingData.seasonalPrices.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'season-item';
    div.innerHTML = `<span>${s.start} → ${s.end}: ₪${s.pricePerNightILS}/night</span>`;
    const btn = document.createElement('button');
    btn.textContent = 'Remove';
    btn.addEventListener('click', () => { bookingData.seasonalPrices.splice(i, 1); renderSeasons(); });
    div.appendChild(btn);
    list.appendChild(div);
  });
}

document.getElementById('addSeasonBtn').addEventListener('click', () => {
  const start = document.getElementById('seasonStart').value;
  const end = document.getElementById('seasonEnd').value;
  const price = parseFloat(document.getElementById('seasonPrice').value);
  if (!start || !end || !price) return toast('Fill in start, end, and price first.');
  bookingData.seasonalPrices.push({ start, end, pricePerNightILS: price });
  document.getElementById('seasonStart').value = '';
  document.getElementById('seasonEnd').value = '';
  document.getElementById('seasonPrice').value = '';
  renderSeasons();
});

function dateKey(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function renderCalendar() {
  const y = calViewDate.getFullYear();
  const m = calViewDate.getMonth();
  document.getElementById('calMonthLabel').textContent = calViewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement('div');
    empty.className = 'day-cell empty';
    grid.appendChild(empty);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(y, m, d);
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (bookingData.blockedDates.includes(key) ? ' blocked' : '');
    cell.textContent = d;
    cell.addEventListener('click', () => {
      const idx = bookingData.blockedDates.indexOf(key);
      if (idx === -1) bookingData.blockedDates.push(key); else bookingData.blockedDates.splice(idx, 1);
      renderCalendar();
    });
    grid.appendChild(cell);
  }
}

document.getElementById('calPrev').addEventListener('click', () => { calViewDate.setMonth(calViewDate.getMonth() - 1); renderCalendar(); });
document.getElementById('calNext').addEventListener('click', () => { calViewDate.setMonth(calViewDate.getMonth() + 1); renderCalendar(); });

document.getElementById('saveBtn').addEventListener('click', async () => {
  bookingData.basePriceILS = parseFloat(document.getElementById('basePriceInput').value) || bookingData.basePriceILS;
  bookingData.extraGuestPriceILS = parseFloat(document.getElementById('extraGuestInput').value) || bookingData.extraGuestPriceILS;
  const res = await fetch(`${API}/calendar`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(bookingData),
  });
  if (res.ok) { toast('Saved.'); } else { toast('Failed to save — please try again.'); }
});

document.getElementById('reloadBtn').addEventListener('click', loadDashboard);

checkExistingSession();
</script>

</body>
</html>
